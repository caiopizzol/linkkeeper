<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Link not found</title>
    <style>
      :root {
        --text: #212121;
        --text-muted: #666666;
        --border: #dbdbdb;
        --canvas: #fafafa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 30rem;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <!--
      Replace this page with your own. It is served for any slug not in the
      registry, so it is where a mistyped or retired link lands. A useful one
      says where to browse instead and how to report a broken link.
    -->
    <main>
      <h1>This link does not point to anything</h1>
      <p>
        It may have been mistyped, or it may be a link that was never published. Published links keep working when their
        source moves, so a link that used to work should not land here.
      </p>
    </main>
  </body>
</html>
