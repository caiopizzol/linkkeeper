name: Deploy

# Builds and publishes the redirect table.
#
# Runs on three triggers, because the table depends on two things that change
# independently: this repository, and the catalog it reads.
#
#   push               a change to linkkeeper itself
#   repository_dispatch a change to the catalog, sent by the source repository
#   schedule           a safety net, in case a dispatch is ever missed
#
# The dispatch carries the exact commit the catalog was exported at, so the
# deploy is pinned to one revision rather than to whatever `main` holds when the
# build happens.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [source-updated]
  schedule:
    # 06:17 UTC. Off the hour on purpose: scheduled jobs at :00 queue behind
    # everyone else's.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - name: Resolve the catalog commit
        id: commit
        env:
          DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCHED_SHA}" ]; then
            echo "sha=${DISPATCHED_SHA}" >> "$GITHUB_OUTPUT"
            echo "Building at dispatched catalog commit ${DISPATCHED_SHA}"
          else
            # No dispatch payload: a push, a schedule, or a manual run. The CLI
            # resolves the source's HEAD to a commit itself.
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Building at the catalog's current HEAD"
          fi

      - name: Build the redirect table
        run: |
          set -euo pipefail
          if [ -n "${{ steps.commit.outputs.sha }}" ]; then
            bun run src/cli.ts build --commit "${{ steps.commit.outputs.sha }}"
          else
            bun run src/cli.ts build
          fi

      # A published link that 404s reads as a deleted project, which is worse
      # than never having published it. Registries do drift, so every destination
      # is resolved for real before anything goes live.
      - name: Verify every destination resolves
        run: |
          set -euo pipefail
          if [ -n "${{ steps.commit.outputs.sha }}" ]; then
            bun run src/cli.ts check --commit "${{ steps.commit.outputs.sha }}"
          else
            bun run src/cli.ts check
          fi

      # CLOUDFLARE_PAGES_PROJECT lets a fork deploy to its own Pages project
      # without editing this file. Defaults to the repository name.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ./dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
            --branch=main
